<svg width="440" height="86" viewBox="0 0 440 86" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="24%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="52%" stop-color="#a78bfa" stop-opacity="0.82"/>
      <stop offset="78%" stop-color="#22c55e" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-45%" width="160%" height="190%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .btnMeta{font:800 10px 'Segoe UI',Arial,sans-serif;letter-spacing:2.5px;fill:#67e8f9}
      .btnTitle{font:900 22px 'Segoe UI',Arial,sans-serif;fill:#f8fafc;letter-spacing:1px}
      .arrow{font:900 24px 'Segoe UI',Arial,sans-serif;fill:#22d3ee}
    </style>
  </defs>
  <rect width="440" height="86" rx="22" fill="url(#bg)"/>
  <rect x="8" y="8" width="424" height="70" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="180 50">
    <animate attributeName="stroke-dashoffset" from="0" to="-230" dur="14s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(36 43)" filter="url(#glow)">
    <circle r="12" fill="#22d3ee" opacity="0.9"/>
    <circle r="6" fill="#f8fafc"/>
  </g>
  <g transform="translate(84 31)">
    <text x="0" y="0" class="btnMeta">OPEN REPOSITORY MATRIX</text>
    <text x="0" y="25" class="btnTitle">Explore All Repositories</text>
  </g>
  <text x="384" y="51" class="arrow" filter="url(#glow)">-></text>
</svg>
